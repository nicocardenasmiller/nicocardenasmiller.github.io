es:
  title: "Nicolás Cárdenas-Miller"
  description: "Nicolás Cárdenas-Miller, estudiante de doctorado en ciencia política en la Universidad de Carolina del Norte en Chapel Hill. Economía política comparada."
  role: "Estudiante de doctorado, Departamento de Ciencia Política, Universidad de Carolina del Norte en Chapel Hill"
  about: "Sobre mí"
  interests: "Temas de investigación"
  interest_list: "Economía política comparada, preferencias comerciales, capital internacional, América Latina"
  contact: "Contacto"
  alt: "Retrato de Nicolás Cárdenas-Miller"
  bio:
    - 'Me llamo Nicolás Cárdenas-Miller. Tengo títulos de Bachelor of Science en economía y ciencia política de <a href="https://www.psu.edu/">la Universidad Estatal de Pensilvania, University Park</a>. Actualmente soy estudiante de doctorado en ciencia política en la <a href="https://politicalscience.unc.edu/">Universidad de Carolina del Norte en Chapel Hill</a>.'
    - 'Estudio economía política comparada. En particular, me interesa analizar cómo los cambios en las empresas y el comercio afectan la ideología política en América Latina. Mi investigación anterior ha examinado la ideología política chilena, la atención visual y la memoria, y las ilusiones vocálicas en la percepción del habla en una segunda lengua. Mi trabajo sobre atención visual y memoria fue publicado en <em>Memory and Cognition</em> en 2023.'
    - 'Fuera de lo académico, me apasiona la lectura, correr largas distancias y tocar guitarra.'
