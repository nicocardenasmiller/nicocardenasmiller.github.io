  title: "Nicolás Cárdenas-Miller"
  description: "Nicolás Cárdenas-Miller, PhD student in political science at the University of North Carolina at Chapel Hill, studying comparative political economy."
  role: "PhD Student, Department of Political Science, University of North Carolina at Chapel Hill"
  about: "About"
  interests: "Research interests"
  interest_list: "Comparative political economy, trade preferences, international capital, Latin America"
  contact: "Contact"
  alt: "Portrait of Nicolás Cárdenas-Miller"
  bio:
    - 'My name is Nicolás Cárdenas-Miller. I hold Bachelors of Science degrees at <a href="https://www.psu.edu/">the Pennsylvania State University, University Park</a> in economics and political science. Currently I am a PhD student in political science at the <a href="https://politicalscience.unc.edu/">University of North Carolina, Chapel Hill</a>.'
    - 'I study comparative political economy. Specifically, I am interested in looking at the ways in which firm changes and trade affect political ideology in Latin America. My previous research has examined Chilean political ideology, visual attention and memory, and vowel illusions in L2 speech perception. My work in visual attention and memory has been published in the <em>Memory and Cognition Journal</em> in 2023.'
    - 'My passions outside of academics include reading, long distance running, and playing guitar.'
